<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketDesk LIVE</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0e14;--surface:#0f1319;--card:#141a22;--cardHover:#1a2230;--border:#1c2433;--borderLight:#263044;--up:#00e676;--upDim:rgba(0,230,118,0.08);--upBorder:rgba(0,230,118,0.2);--down:#ff1744;--downDim:rgba(255,23,68,0.08);--downBorder:rgba(255,23,68,0.2);--amber:#ffab00;--amberDim:rgba(255,171,0,0.1);--cyan:#18ffff;--cyanDim:rgba(24,255,255,0.08);--text:#cdd6e4;--muted:#7a8ba8;--dim:#4a5670;--accent:#448aff;--accentDim:rgba(68,138,255,0.08);--mono:'JetBrains Mono','Fira Code',monospace;--sans:'Barlow',-apple-system,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;min-height:100vh;}
  ::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{display:inline-block;width:6px;height:6px;border-radius:50%;animation:pulse 2s infinite;margin-right:6px;}
  .pulse-up{background:var(--up);box-shadow:0 0 6px var(--up);}
  .pulse-amber{background:var(--amber);box-shadow:0 0 6px var(--amber);}
  .pulse-cyan{background:var(--cyan);box-shadow:0 0 6px var(--cyan);}
  .pulse-accent{background:var(--accent);box-shadow:0 0 6px var(--accent);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;transition:all 0.2s;}
  .card:hover{background:var(--cardHover);border-color:var(--borderLight);}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:48px;flex-wrap:wrap;gap:8px;}
  .logo{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--cyan);letter-spacing:2px;}
  .logo span{color:var(--muted);}.logo .live{font-size:10px;color:var(--up);background:var(--upDim);border:1px solid var(--upBorder);padding:1px 6px;border-radius:3px;margin-left:8px;letter-spacing:1px;}
  .status-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:6px 20px;display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:10px;overflow-x:auto;}
  .status-item{display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .status-dot{width:8px;height:8px;border-radius:50%;}
  .status-dot.ok{background:var(--up);}.status-dot.fail{background:var(--down);}.status-dot.loading{background:var(--amber);animation:pulse 1s infinite;}
  .section-label{font-size:10px;font-family:var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .grid{display:grid;gap:14px;padding:16px;}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
  .data-card{padding:16px 18px;border-left:3px solid var(--border);animation:fadeIn 0.4s ease both;}
  .data-card.up{border-left-color:var(--up);}.data-card.down{border-left-color:var(--down);}
  .data-ticker{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;margin-bottom:4px;}
  .data-value{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-0.5px;}
  .data-change{font-family:var(--mono);font-size:12px;font-weight:700;margin-top:4px;}
  .data-name{font-size:11px;color:var(--muted);margin-top:2px;}
  .data-sub{font-size:10px;color:var(--dim);margin-top:4px;font-family:var(--mono);}
  .refresh-btn{background:var(--cyanDim);color:var(--cyan);border:1px solid rgba(24,255,255,0.2);border-radius:6px;padding:8px 18px;font-family:var(--mono);font-size:11px;font-weight:600;cursor:pointer;letter-spacing:1px;transition:all 0.2s;}
  .refresh-btn:hover{background:rgba(24,255,255,0.15);}.refresh-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .last-update{font-family:var(--mono);font-size:10px;color:var(--dim);}
  .footer{border-top:1px solid var(--border);padding:8px 20px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);flex-wrap:wrap;gap:4px;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin 0.8s linear infinite;}
  @media(max-width:768px){.grid-cards{grid-template-columns:1fr 1fr;}.topbar{height:auto;padding:10px 12px;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">◆ MARKET<span>DESK</span><span class="live">LIVE</span></div>
  <div style="display:flex;align-items:center;gap:14px;">
    <span class="last-update" id="lastUpdate">Carregando...</span>
    <button class="refresh-btn" id="refreshBtn" onclick="fetchAllData()">↻ ATUALIZAR</button>
    <span id="clock" style="font-family:var(--mono);font-size:12px;color:var(--cyan);font-weight:600;letter-spacing:1px;"></span>
  </div>
</div>

<div class="status-bar">
  <div class="status-item"><div class="status-dot loading" id="dot-awesomeapi"></div><span style="color:var(--muted)">Câmbio</span></div>
  <div class="status-item"><div class="status-dot loading" id="dot-coingecko"></div><span style="color:var(--muted)">Crypto</span></div>
  <div class="status-item"><div class="status-dot loading" id="dot-brapi"></div><span style="color:var(--muted)">B3</span></div>
  <div class="status-item"><div class="status-dot loading" id="dot-us"></div><span style="color:var(--muted)">EUA</span></div>
  <div style="flex:1"></div>
  <span style="color:var(--dim);">Auto-refresh: 15min · Botão atualiza na hora</span>
</div>

<div class="grid" style="grid-template-columns:1fr;">

  <div>
    <div class="section-label"><span class="pulse pulse-up"></span>Câmbio — Tempo Real</div>
    <div class="grid-cards" id="forexGrid"><div class="card data-card"><div class="data-value"><span class="spinner"></span></div></div></div>
  </div>

  <div>
    <div class="section-label"><span class="pulse pulse-amber"></span>Crypto</div>
    <div class="grid-cards" id="cryptoGrid"><div class="card data-card"><div class="data-value"><span class="spinner"></span></div></div></div>
  </div>

  <div>
    <div class="section-label"><span class="pulse pulse-cyan"></span>Ações & FIIs Brasil — B3</div>
    <div class="grid-cards" id="brapiGrid"><div class="card data-card"><div class="data-value"><span class="spinner"></span></div></div></div>
  </div>

  <div>
    <div class="section-label"><span class="pulse pulse-accent"></span>Mercado EUA — Índices & Ações</div>
    <div class="grid-cards" id="usGrid"><div class="card data-card"><div class="data-value"><span class="spinner"></span></div></div></div>
  </div>

</div>

<div class="footer">
  <span>MARKETDESK LIVE · Não constitui recomendação de investimento</span>
  <span id="footerDate"></span>
</div>

<script>
// ============ CLOCK ============
function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('footerDate').textContent='◆ '+now.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
}
setInterval(updateClock,1000);updateClock();

// ============ HELPERS ============
function setStatus(api,s){const d=document.getElementById('dot-'+api);if(d)d.className='status-dot '+s;}
function fmt(n,d=2){return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtUSD(n,d=2){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}

function makeCard(ticker,name,value,change,changeNum,sub){
  const dir=changeNum>=0?'up':'down', arrow=changeNum>=0?'▲':'▼';
  return `<div class="card data-card ${dir}"><div class="data-ticker">${ticker}</div><div class="data-value">${value}</div><div class="data-change" style="color:var(--${dir})">${arrow} ${change}</div><div class="data-name">${name}</div>${sub?`<div class="data-sub">${sub}</div>`:''}</div>`;
}

function errorCard(msg){return `<div class="card data-card" style="border-left-color:var(--down);grid-column:1/-1;padding:16px;"><div class="data-ticker" style="color:var(--down)">${msg}</div></div>`;}

// ============ 1. CÂMBIO (AwesomeAPI) ============
async function fetchForex(){
  setStatus('awesomeapi','loading');
  try{
    const r=await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,GBP-BRL,CNY-BRL,JPY-BRL,ARS-BRL');
    const data=await r.json();
    const pairs=[{key:'USDBRL',name:'Dólar Americano',flag:'🇺🇸'},{key:'EURBRL',name:'Euro',flag:'🇪🇺'},{key:'GBPBRL',name:'Libra Esterlina',flag:'🇬🇧'},{key:'CNYBRL',name:'Yuan Chinês',flag:'🇨🇳'},{key:'JPYBRL',name:'Iene Japonês',flag:'🇯🇵'},{key:'ARSBRL',name:'Peso Argentino',flag:'🇦🇷'}];
    let html='';
    for(const p of pairs){const d=data[p.key];if(!d)continue;html+=makeCard(`${p.flag} ${d.code}/${d.codein}`,p.name,'R$ '+fmt(parseFloat(d.bid),4),fmt(Math.abs(parseFloat(d.pctChange)))+'%',parseFloat(d.pctChange),`Mín: ${fmt(parseFloat(d.low),4)} · Máx: ${fmt(parseFloat(d.high),4)}`);}
    document.getElementById('forexGrid').innerHTML=html;setStatus('awesomeapi','ok');
  }catch(e){setStatus('awesomeapi','fail');document.getElementById('forexGrid').innerHTML=errorCard('Câmbio: '+e.message);}
}

// ============ 2. CRYPTO (CoinGecko — BTC e ETH) ============
async function fetchCrypto(){
  setStatus('coingecko','loading');
  try{
    const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd,brl&include_24hr_change=true&include_market_cap=true');
    const data=await r.json();
    const coins=[{id:'bitcoin',sym:'BTC',name:'Bitcoin',icon:'₿'},{id:'ethereum',sym:'ETH',name:'Ethereum',icon:'Ξ'}];
    let html='';
    for(const c of coins){const d=data[c.id];if(!d)continue;const pct=d.usd_24h_change||0,mcap=d.usd_market_cap,ms=mcap>1e12?fmt(mcap/1e12,1)+'T':fmt(mcap/1e9,1)+'B';html+=makeCard(`${c.icon} ${c.sym}/USD`,c.name,fmtUSD(d.usd,d.usd>100?0:2),fmt(Math.abs(pct))+'%',pct,`R$ ${fmt(d.brl,2)} · MCap: $${ms}`);}
    document.getElementById('cryptoGrid').innerHTML=html;setStatus('coingecko','ok');
  }catch(e){setStatus('coingecko','fail');document.getElementById('cryptoGrid').innerHTML=errorCard('Crypto: '+e.message);}
}

// ============ 3. AÇÕES BR (Brapi — 1 ticker/req) ============
async function fetchBrapi(){
  setStatus('brapi','loading');
  const T='qtnchm9faiVeLDdhHy33Nb';
  const tickers=['PETR4','VALE3','ITUB4','BBAS3','TAEE11','CMIG4','BBSE3','ITSA4','SAPR4','ALUP11','BTLG11','CPTS11','KLBN4'];
  let all=[],err=0;
  await Promise.all(tickers.map(t=>fetch(`https://brapi.dev/api/quote/${t}?token=${T}`).then(r=>r.json()).then(d=>{if(d.results&&d.results[0])all.push(d.results[0]);}).catch(()=>err++)));
  if(!all.length){setStatus('brapi','fail');document.getElementById('brapiGrid').innerHTML=errorCard('B3: nenhum dado');return;}
  all.sort((a,b)=>(b.regularMarketChangePercent||0)-(a.regularMarketChangePercent||0));
  let html='';
  for(const s of all){const p=s.regularMarketChangePercent||0;html+=makeCard(`🇧🇷 ${s.symbol}`,(s.longName||s.shortName||'').substring(0,28),'R$ '+fmt(s.regularMarketPrice,2),fmt(Math.abs(p))+'%',p,`Mín: ${fmt(s.regularMarketDayLow||0,2)} · Máx: ${fmt(s.regularMarketDayHigh||0,2)}`);}
  if(err)html+=`<div style="grid-column:1/-1;font-family:var(--mono);font-size:10px;color:var(--amber);padding:4px;">⚠ ${err} falharam</div>`;
  document.getElementById('brapiGrid').innerHTML=html;setStatus('brapi','ok');
}

// ============ 4. EUA (Yahoo Finance) ============
async function fetchUS(){
  setStatus('us','loading');
  const syms=[
    {t:'SPY',n:'S&P 500 ETF'},{t:'QQQ',n:'Nasdaq 100 ETF'},{t:'DIA',n:'Dow Jones ETF'},
    {t:'ORCL',n:'Oracle'},{t:'GOOGL',n:'Alphabet'},{t:'IBM',n:'IBM'},
    {t:'CVX',n:'Chevron'},{t:'NKE',n:'Nike'},{t:'UNH',n:'UnitedHealth'},
    {t:'DLR',n:'Digital Realty'},{t:'O',n:'Realty Income'},{t:'DE',n:'Deere & Co'},
    {t:'ENB',n:'Enbridge'},{t:'TROW',n:'T. Rowe Price'},
  ];
  let all=[],err=0;

  // Tentar Yahoo Finance
  await Promise.all(syms.map(s=>
    fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${s.t}?interval=1d&range=1d`)
    .then(r=>{if(!r.ok)throw new Error();return r.json();})
    .then(d=>{
      const m=d.chart.result[0].meta;
      const price=m.regularMarketPrice, prev=m.chartPreviousClose||m.previousClose;
      const pct=((price-prev)/prev)*100;
      all.push({sym:s.t,name:s.n,price,pct,high:m.regularMarketDayHigh||price,low:m.regularMarketDayLow||price,cur:m.currency});
    }).catch(()=>err++)
  ));

  // Se Yahoo falhou totalmente, tentar Brapi como fallback (alguns tickers US funcionam)
  if(all.length===0){
    const usTickers=['AAPL34','GOGL34','MSFT34']; // BDRs via Brapi
    const T='qtnchm9faiVeLDdhHy33Nb';
    await Promise.all(usTickers.map(t=>
      fetch(`https://brapi.dev/api/quote/${t}?token=${T}`).then(r=>r.json()).then(d=>{
        if(d.results&&d.results[0]){const s=d.results[0];all.push({sym:s.symbol,name:s.longName||s.shortName||'',price:s.regularMarketPrice,pct:s.regularMarketChangePercent||0,high:s.regularMarketDayHigh||0,low:s.regularMarketDayLow||0,cur:'BRL'});}
      }).catch(()=>{})
    ));
  }

  if(!all.length){
    setStatus('us','fail');
    document.getElementById('usGrid').innerHTML=`<div class="card data-card" style="border-left-color:var(--amber);grid-column:1/-1;padding:20px;">
      <div class="data-ticker" style="color:var(--amber)">EUA — ACESSO BLOQUEADO LOCALMENTE</div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px;line-height:1.8;">
        O Yahoo Finance bloqueia acesso direto de arquivos locais (CORS).<br>
        <strong style="color:var(--cyan)">Solução:</strong> suba no GitHub Pages — lá funciona normalmente.<br>
        Ou instale a extensão <strong style="color:var(--cyan)">CORS Unblock</strong> no Chrome para testar local.
      </div>
    </div>`;
    return;
  }

  all.sort((a,b)=>b.pct-a.pct);
  let html='';
  for(const s of all){
    const isIdx=['SPY','QQQ','DIA'].includes(s.sym);
    const v=s.cur==='USD'?fmtUSD(s.price,2):'R$ '+fmt(s.price,2);
    html+=makeCard(`${isIdx?'🇺🇸 ':''}${s.sym}`,s.name,v,fmt(Math.abs(s.pct))+'%',s.pct,`Mín: ${fmtUSD(s.low,2)} · Máx: ${fmtUSD(s.high,2)}`);
  }
  if(err)html+=`<div style="grid-column:1/-1;font-family:var(--mono);font-size:10px;color:var(--amber);padding:4px;">⚠ ${err} ticker(s) não carregaram</div>`;
  document.getElementById('usGrid').innerHTML=html;
  setStatus('us','ok');
}

// ============ FETCH ALL ============
async function fetchAllData(){
  const btn=document.getElementById('refreshBtn');
  btn.disabled=true;btn.textContent='⟳ ATUALIZANDO...';
  await Promise.allSettled([fetchForex(),fetchCrypto(),fetchBrapi(),fetchUS()]);
  document.getElementById('lastUpdate').textContent='Atualizado: '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  btn.disabled=false;btn.textContent='↻ ATUALIZAR';
}

// Auto-refresh 15 min
fetchAllData();
setInterval(fetchAllData,900000);
</script>
</body>
</html>
